<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | Tana Bana</title>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h2>Tana Bana Admin</h2>
      <input id="loginUser" type="text" placeholder="Username"/>
      <input id="loginPass" type="password" placeholder="Password"/>
      <button onclick="doLogin()">Login</button>
      <p id="loginErr" class="err"></p>
    </div>
  </div>

  <script>
    async function doLogin() {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value }),
      });
      if (res.ok) location.href = 'products.html';
      else document.getElementById('loginErr').textContent = 'Invalid credentials';
    }

    fetch('/api/admin/me').then(r => { if (r.ok) location.href = 'products.html'; });
  </script>
</body>
</html>
