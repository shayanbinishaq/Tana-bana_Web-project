<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product | Tana Bana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header id="top-head">
  <h2>Shop now &amp; get free delivery</h2>
</header>

<div class="nav-bar">
  <header class="nav">
    <div class="logo">
      <a href="index.html">
        <img src="assets/main page/logo/logo_desktop.png" alt="Tana Bana"/>
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="mothers_day.html">MOTHER'S DAY SALE</a></li>
        <li><a href="spring_summer.html">SPRING SUMMER 2026</a></li>
        <li><a href="Ready_to_wear.html">READY TO WEAR</a></li>
        <li><a href="#">UNSTITCHED</a></li>
        <li><a href="#">FESTIVE WEAR</a></li>

      </ul>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Open menu">&#9776;</button>
  </header>
  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&#x2715;</button>
    <ul>
      <li><a href="mothers_day.html">MOTHER'S DAY SALE</a></li>
      <li><a href="spring_summer.html">SPRING SUMMER 2026</a></li>
      <li><a href="Ready_to_wear.html">READY TO WEAR</a></li>
      <li><a href="#">UNSTITCHED</a></li>
      <li><a href="#">FESTIVE WEAR</a></li>
    </ul>
  </div>
  <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
</div>

<div class="breadcrumb">
  <a href="index.html">Home</a>
  <span>&#8250;</span>
  <a href="#" id="bcCollLink" style="color:#888">Collection</a>
  <span>&#8250;</span>
  <span id="bcName">Product</span>
</div>

<div id="pageContent">
  <div class="page-loading">Loading product…</div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const pid = new URLSearchParams(location.search).get('id');
let _product=null, _qty=1, _size='S';

async function loadProduct() {
  if(!pid){ document.getElementById('pageContent').innerHTML='<div class="page-loading">No product ID.</div>'; return; }
  try {
    const r = await fetch('/api/products/'+pid);
    if(!r.ok) throw new Error(r.status);
    _product = await r.json();
    render(_product);
  } catch(e) {
    document.getElementById('pageContent').innerHTML=
      '<div class="page-loading">Could not load product. <a href="index.html">Go home</a></div>';
  }
}

function render(p) {
  const isUpload = p.img_main && !p.img_main.startsWith('assets/');
  const imgMain  = p.img_main  ? (isUpload ? '/uploads/'+p.img_main : '/'+p.img_main) : null;
  const imgHover = p.img_hover ? (p.img_hover.startsWith('assets/')  ? '/'+p.img_hover : '/uploads/'+p.img_hover) : imgMain;

  const price = Number(p.price).toLocaleString('en-PK');
  const code  = p.name.includes('-') ? p.name.split('-').slice(-1)[0].trim() : String(p.id).padStart(5,'0');

  document.getElementById('bcName').textContent = p.name;
  const colMap = {'Mothers Day Sale':'mothers_day.html','Spring Summer 2026':'spring_summer.html','Ready To Wear':'Ready_to_wear.html'};
  const bcLink = document.getElementById('bcCollLink');
  bcLink.textContent = p.collection||'Collection';
  bcLink.href = colMap[p.collection]||'#';
  document.title = p.name+' | Tana Bana';

  document.getElementById('pageContent').innerHTML = `
    <div class="product-page">
      <div class="gallery">
        <div class="gallery-thumbs">
          ${imgMain?`<img class="thumb-img active" src="${esc(imgMain)}" onclick="swapMain('${esc(imgMain)}',this)"/>
          ${imgHover&&imgHover!==imgMain?`<img class="thumb-img" src="${esc(imgHover)}" onclick="swapMain('${esc(imgHover)}',this)"/>`:''}`:'' }
        </div>
        ${imgMain
          ? `<div class="gallery-main-wrap">
               <img class="gimg-main" id="gMain" src="${esc(imgMain)}" alt="${esc(p.name)}"/>
               <img class="gimg-hover" src="${esc(imgHover||imgMain)}" alt="${esc(p.name)} hover"/>
             </div>`
          : `<div class="no-img-box">No Image Available</div>`}
      </div>

      <div class="product-info-panel">
        <div class="pi-vendor">${esc(p.brand)}</div>
        <h1 class="pi-name">${esc(p.name)}</h1>
        <div class="pi-sku">SKU:</div>
        <div class="pi-divider"></div>
        <div class="pi-price">Rs.${price}</div>
        <div class="design-code-label">DESIGN CODE: ${esc(code)}</div>
        <span class="design-code-badge">${esc(code)}</span>

        <div class="size-label">SIZE: <span id="sLbl">S</span><span class="size-guide-link">Size Guide</span></div>
        <div class="size-options">
          ${['S','M','L','XL'].map(s=>`<button class="size-btn${s==='S'?' selected':''}" data-s="${s}" onclick="pickSize(this)">${s}</button>`).join('')}
        </div>

        <div class="pi-divider"></div>

        <div class="accordion-block">
          <div class="accordion-row" onclick="toggleAcc('desc')">
            <span>Description</span>
            <span class="accordion-icon" id="ai-desc">&#8722;</span>
          </div>
          <div class="accordion-body open" id="ab-desc">
            <div class="accordion-content">
              <strong>Type:</strong> ${esc(p.category||'—')}<br/>
              <ul style="margin-top:8px">
                <li>Collection: ${esc(p.collection||'—')}</li>
                <li>Brand: ${esc(p.brand||'—')}</li>
              </ul>
            </div>
          </div>
          <div class="accordion-row" onclick="toggleAcc('care')">
            <span>Care Instructions</span>
            <span class="accordion-icon" id="ai-care">+</span>
          </div>
          <div class="accordion-body" id="ab-care">
            <div class="accordion-content">
              <ul>
                <li>Hand wash or gentle machine wash</li>
                <li>Do not bleach</li>
                <li>Iron on low heat</li>
                <li>Dry in shade</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function swapMain(src, thumb) {
  document.querySelectorAll('.thumb-img').forEach(t=>t.classList.remove('active'));
  thumb.classList.add('active');
  const el=document.getElementById('gMain'); if(el) el.src=src;
}
function pickSize(btn) {
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected'); _size=btn.dataset.s;
  const l=document.getElementById('sLbl'); if(l) l.textContent=_size;
}
function chQty(d) {
  _qty=Math.max(1,_qty+d);
  const el=document.getElementById('qtyNum'); if(el) el.textContent=_qty;
}
function toggleAcc(id) {
  const b=document.getElementById('ab-'+id), i=document.getElementById('ai-'+id);
  if(!b) return;
  const o=b.classList.toggle('open');
  if(i) i.innerHTML=o?'&#8722;':'+';
}

loadProduct();
</script>
</body>
</html>
